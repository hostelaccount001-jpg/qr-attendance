<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>QR Scanner</title>

<script
src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<style>

* {
  box-sizing:border-box;
}

body {

  margin:0;

  min-height:100vh;

  background:#f5f7fb;

  font-family:Arial,sans-serif;

  color:#111827;

}

.header {

  text-align:center;

  padding:20px 15px 10px;

}

.header h1 {

  margin:0;

  font-size:28px;

}

#reader {

  width:100%;

  max-width:600px;

  margin:auto;

}

.permissionBox {

  text-align:center;

  padding:30px 20px;

}

.cameraIcon {

  font-size:55px;

}

button {

  width:90%;

  max-width:550px;

  display:block;

  margin:12px auto;

  padding:18px;

  border:0;

  border-radius:15px;

  font-size:19px;

  font-weight:bold;

  color:white;

}

.allowBtn {

  background:#15803d;

}

.backBtn {

  background:#555;

}

.message {

  text-align:center;

  padding:12px;

  font-size:20px;

  font-weight:bold;

  min-height:55px;

}

.success {

  color:#15803d;

}

.error {

  color:#b91c1c;

}

.name {

  font-size:25px;

  color:#111827;

}

.hidden {

  display:none !important;

}

</style>

</head>

<body>


<div class="header">

<h1>
📷 SCAN STUDENT QR
</h1>

</div>


<!-- CAMERA PERMISSION -->

<div
id="permissionScreen"
class="permissionBox">

<div class="cameraIcon">
📷
</div>

<h2>
Camera Access Required
</h2>

<p>

First time only:
Allow camera access to scan
student QR codes.

</p>


<button
class="allowBtn"
onclick="requestCamera()">

📷 ALLOW CAMERA ACCESS

</button>

</div>


<!-- SCANNER -->

<div
id="scannerArea"
class="hidden">

<div id="reader"></div>

<div
id="message"
class="message">

Ready...

</div>

</div>


<!-- BACK -->

<button
class="backBtn"
onclick="goBack()">

← BACK

</button>


<script>


/* =================================================
   VARIABLES
================================================= */

let qrScanner =
null;

let scannerRunning =
false;

let scanLocked =
false;


/* =================================================
   MESSAGE LISTENER
================================================= */

window.addEventListener(
  "message",
  function(event) {

    if (
      !event.data ||
      typeof event.data !== "object"
    ) {

      return;

    }


    if (
      event.data.type ===
      "ATTENDANCE_RESULT"
    ) {

      showResult(
        event.data
      );

    }

  }
);


/* =================================================
   CAMERA PERMISSION
================================================= */

async function requestCamera() {

  try {

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal:
                "environment"
            }
          },

          audio:false

        });


    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    document
      .getElementById(
        "permissionScreen"
      )
      .classList.add(
        "hidden"
      );


    document
      .getElementById(
        "scannerArea"
      )
      .classList.remove(
        "hidden"
      );


    startScanner();

  }

  catch(error) {

    alert(
      "Camera permission was not allowed. Please select Allow in Chrome."
    );

  }

}


/* =================================================
   START SCANNER
===================================================== */

function startScanner() {

  if (scannerRunning) {
    return;
  }


  qrScanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps:10,

    qrbox: {
      width:250,
      height:250
    }

  };


  qrScanner

    .start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      function(errorMessage) {}

    )

    .then(
      function() {

        scannerRunning =
          true;


        document
          .getElementById(
            "message"
          )
          .innerHTML =

          "📷 Ready for next scan";

      }
    )

    .catch(
      function(error) {

        document
          .getElementById(
            "message"
          )
          .innerHTML =

          "<span class='error'>" +

          "❌ Camera could not be opened." +

          "</span>";

      }
    );

}


/* =================================================
   QR SCANNED
===================================================== */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (scanLocked) {
    return;
  }


  scanLocked =
    true;


  const suid =
    String(
      decodedText
    ).trim();


  document
    .getElementById(
      "message"
    )
    .innerHTML =

    "<span>" +

    "Checking..." +

    "</span>";


  /*

    IMPORTANT:

    Camera does NOT stop.

    We only temporarily lock
    another scan for a moment.

  */


  if (
    window.opener
  ) {

    window.opener.postMessage(

      {

        type:
          "QR_SCANNED",

        suid:
          suid

      },

      "*"

    );

  }
  else {

    document
      .getElementById(
        "message"
      )
      .innerHTML =

      "<span class='error'>" +

      "Please open scanner from Attendance App."

      + "</span>";

    scanLocked =
      false;

  }

}


/* =================================================
   SHOW RESULT
===================================================== */

function showResult(
  result
) {

  let html = "";


  if (
    result.success
  ) {

    html =

      "<span class='success'>" +

      "✓ SCAN SUCCESS" +

      "<br>" +

      "<span class='name'>" +

      escapeHtml(
        result.name
      ) +

      "</span>" +

      "</span>";

  }

  else if (
    result.duplicate
  ) {

    html =

      "<span>" +

      "✓ " +

      "<span class='name'>" +

      escapeHtml(
        result.name
      ) +

      "</span>" +

      "<br>" +

      "<span style='color:#b45309;font-size:16px'>" +

      "Already marked"

      + "</span>" +

      "</span>";

  }

  else {

    html =

      "<span class='error'>" +

      escapeHtml(
        result.message ||
        "Student not found"
      ) +

      "</span>";

  }


  document
    .getElementById(
      "message"
    )
    .innerHTML =
      html;


  /*

    Keep scanner open.

    After 1.5 seconds,
    allow next scan.

  */

  setTimeout(
    function() {

      scanLocked =
        false;


      document
        .getElementById(
          "message"
        )
        .innerHTML =

        "📷 Ready for next scan";

    },
    1500
  );

}


/* =================================================
   BACK
===================================================== */

function goBack() {

  if (
    qrScanner &&
    scannerRunning
  ) {

    qrScanner
      .stop()
      .then(
        function() {

          scannerRunning =
            false;

          window.close();

        }
      )
      .catch(
        function() {

          window.close();

        }
      );

  }
  else {

    window.close();

  }

}


/* =================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
