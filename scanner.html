<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    *{box-sizing:border-box;font-family:Arial,sans-serif}
    body{margin:0;background:#111827;color:white;min-height:100vh}
    .wrap{max-width:520px;margin:auto;padding:14px}
    .top{background:white;color:#111827;border-radius:18px;padding:12px;text-align:center;margin-bottom:12px}
    #status{font-size:22px;font-weight:900;min-height:30px}
    #scanner{background:white;border-radius:18px;overflow:hidden}
    .hint{text-align:center;color:#cbd5e1;font-size:13px;margin:10px 0}
    .back{width:100%;border:0;border-radius:14px;padding:16px;background:#4b5563;color:white;font-size:18px;font-weight:800;margin-top:12px}
    .ok{color:#15803d}
    .bad{color:#b91c1c}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div id="status">📷 READY</div>
    <div class="hint">Only 6-digit SUID QR is accepted</div>
  </div>

  <div id="scanner"></div>

  <button class="back" onclick="goBack()">← BACK</button>
</div>

<script>
let scanner = null;
let lastSuid = '';
let lastScanTime = 0;
let busy = false;

function setStatus(text, good) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = good ? 'ok' : 'bad';
}

function onScanSuccess(decodedText) {
  const suid = String(decodedText || '').trim();

  // STRICT: exactly 6 numeric digits.
  if (!/^\d{6}$/.test(suid)) {
    setStatus('❌ INVALID QR', false);
    return;
  }

  // Prevent the same QR from firing many times immediately.
  const now = Date.now();
  if (busy || (suid === lastSuid && now - lastScanTime < 1800)) {
    return;
  }

  busy = true;
  lastSuid = suid;
  lastScanTime = now;

  // Only show DONE; no student name.
  setStatus('✓ DONE', true);

  if (window.opener && !window.opener.closed) {
    window.opener.postMessage({
      type: 'QR_ATTENDANCE_SCAN',
      suid: suid
    }, '*');
  }

  // Keep camera running. Allow the next scan shortly.
  setTimeout(function() {
    busy = false;
    setStatus('📷 READY', true);
  }, 900);
}

function onScanFailure(errorMessage) {
  // Normal camera scanning produces many "not found" messages.
  // Do not show them to the user.
}

function startScanner() {
  scanner = new Html5Qrcode("scanner");

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 15,
      qrbox: { width: 260, height: 260 },
      aspectRatio: 1.0
    },
    onScanSuccess,
    onScanFailure
  ).catch(function(err) {
    setStatus('❌ CAMERA ERROR', false);
  });
}

function goBack() {
  if (scanner) {
    scanner.stop()
      .catch(function(){})
      .finally(function() {
        window.close();
      });
  } else {
    window.close();
  }
}

window.addEventListener('message', function(event) {
  if (!event.data || event.data.type !== 'QR_ATTENDANCE_RESULT') return;

  if (event.data.ok) {
    setStatus('✓ DONE', true);
  } else {
    setStatus('❌ ' + (event.data.message || 'NOT SAVED'), false);
  }

  setTimeout(function() {
    setStatus('📷 READY', true);
  }, 900);
});

startScanner();
</script>
</body>
</html>
